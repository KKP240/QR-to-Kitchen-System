AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: QR-to-Kitchen System (serverless)

Parameters:
  TablePrefix:
    Type: String
    Default: "qrk-"

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [x86_64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_PREFIX: !Ref TablePrefix

Resources:
  # ---------- API ----------
  HealthUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref HealthFunction
      AuthType: NONE

  HealthUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref HealthFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

  MenuListUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref MenuListFunction
      AuthType: NONE

  MenuListUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref MenuListFunction
      Principal: "*"
      FunctionUrlAuthType: NONE
  
  HealthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HealthFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  MenuListInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MenuListFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- Lambda ----------
  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        External: ["@aws-sdk/*"]
        EntryPoints: [src/handlers/health.ts]
    Properties:
      CodeUri: ../apps/api/
      Handler: health.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"

  MenuListFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        External: ["@aws-sdk/*"]
        EntryPoints: [src/handlers/menu-list.ts]
    Properties:
      CodeUri: ../apps/api/
      Handler: menu-list.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"

  SeedFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        External: ["@aws-sdk/*"]
        EntryPoints: [src/handlers/seed.ts]
    Properties:
      CodeUri: ../apps/api/
      Handler: seed.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"

  # ---------- DynamoDB ----------
  MenuTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}Menu"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}Orders"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  TablesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}Tables"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}Connections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH

Outputs:
  HealthUrl:
    Value: !GetAtt HealthUrl.FunctionUrl
  MenuListUrl:
    Value: !GetAtt MenuListUrl.FunctionUrl